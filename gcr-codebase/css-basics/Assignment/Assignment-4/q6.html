<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style5.css">
</head>

<body>

    <main>

        <h1>My Photo Gallery</h1>

        <p class="subtitle">
            A collection of beautiful places and moments
        </p>

        <div class="gallery">

            <!-- Image 1 -->
            <div class="photo">
                <img
                    src="https://images.unsplash.com/photo-1524492412937-b28074a5d7da"
                    alt="Mountain">

                <div class="caption">
                    Taj Mahal
                </div>
            </div>

            <!-- Image 2 -->
            <div class="photo">
                <img
                    src="https://images.unsplash.com/photo-1477587458883-47145ed94245"
                    alt="Jaipur">

                <div class="caption">
                    Jaipur
                </div>
            </div>

            <!-- Image 3 -->
            <div class="photo">
                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSmrIAM4Fv7noMyqmRgvBOyxsUhpi21yV6mykoFKML75g&s=10"
                    alt="Architecture">

                <div class="caption">
                    Beautiful Architecture
                </div>
            </div>

            <!-- Image 4 -->
            <div class="photo">
                <img
                    src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                    alt="Mountain">

                <div class="caption">
                    Mountain View
                </div>
            </div>

            <!-- Image 5 -->
            <div class="photo">
                <img
                    src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                    alt="Nature">

                <div class="caption">
                    Nature
                </div>
            </div>

            <!-- Image 6 -->
            <div class="photo">
                <img
                    src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                    alt="Beach">

                <div class="caption">
                    Beach
                </div>
            </div>

        </div>

    </main>

</body>

</html>
